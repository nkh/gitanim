name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck perl gcc g++

      - name: Shellcheck all .sh files
        run: |
          find . -name "*.sh" -not -path "./.git/*" -not -path "./bin/*" -not -path "./tests/examples/*" \
            -print0 | xargs -0 shellcheck -e SC1090,SC1091,SC2086,SC2155 || true

      - name: Perl syntax check all .pl files
        run: |
          find . -name "*.pl" -not -path "./.git/*" -not -path "./bin/*" -not -path "./tests/examples/*" \
            -print0 | xargs -0 perl -c

      - name: C syntax check all .c files
        run: |
          find . -name "*.c" -not -path "./.git/*" -not -path "./bin/*" \
            -print0 | xargs -0 -I{} sh -c 'gcc -fsyntax-only -Wall -Wextra -I layers/c -I animator/c {}'
