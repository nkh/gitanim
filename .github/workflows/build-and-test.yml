name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ perl vim

      - name: Build
        run: make

      - name: Run animator tests
        run: |
          pass=0; fail=0
          for t in animator/tests/test_*.pl; do
            name=$(basename "$t" .pl)
            result=$(perl "$t" 2>&1 | tail -1)
            echo "$name: $result"
            if echo "$result" | grep -q "0 failed"; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
            fi
          done
          echo "=== Test suites: $pass passed, $fail failed ==="
          exit $fail

      - name: Run l2r tests
        run: bash l2r_test/test_l2r.sh

      - name: Run example tests (no flags)
        run: |
          pass=0; fail=0
          for d in examples/*/; do
            old=""; new=""
            for ext in py txt go rs c ts sh yaml yml json xml html css js rb php java kt swift scala ex cl; do
              [ -f "$d/old.$ext" ] && old="$d/old.$ext" && break
            done
            for ext in py txt go rs c ts sh yaml yml json xml html css js rb php java kt swift scala ex cl; do
              [ -f "$d/new.$ext" ] && new="$d/new.$ext" && break
            done
            [ -z "$old" ] || [ -z "$new" ] && continue
            DIFFVIM_LEFT_TO_RIGHT=1 ./compute/bin/diffvim-compute-cpp "$old" "$new" /tmp/r.txt 2>/dev/null
            DV_OLD_FILE="$old" ./animator/bin/diffvim-postprocess < /tmp/r.txt > /tmp/p.txt 2>/dev/null
            ./animator/bin/diffvim-pace < /tmp/p.txt > /tmp/t.txt 2>/dev/null
            ./animator/bin/diffvim-animator-c --no-display --speed 1000 --snapshot /tmp/s.txt "$old" < /tmp/t.txt 2>/dev/null
            if diff -q /tmp/s.txt "$new" >/dev/null 2>&1; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
              echo "FAIL: $(basename $d)"
            fi
          done
          echo "=== Examples: $pass/$((pass+fail)) passed ==="
          exit $fail
