# animator/layers.conf — Postprocess layer manifest (dynamic discovery).
#
# This is the single source of truth for the postprocess layer pipeline.
# The orchestrator (animator/bin/diffvim-postprocess) reads this file at
# startup to determine:
#   * which layers exist
#   * in what order they run
#   * which CLI flag enables each optional layer
#   * which language implementation to use (C preferred, Perl fallback)
#
# Adding a new layer is purely declarative — drop the binary in place
# (animator/bin/pp_<name> for C, animator/perl/pp_<name>.pl for Perl,
# or any executable matching the name) and add ONE line to this file.
# No changes are required to diffvim, diffvim-pipeline, the Makefile's
# layer list, or any other code.
#
# Format (whitespace-separated; '#' starts a comment):
#
#   <name>  <order>  <flag>  "<description>"
#
# Fields:
#   name         — layer identifier (used in --layers=name,name and --list-layers).
#                  Looked up as: $ROOT/animator/bin/pp_<name>   (preferred, C)
#                                $ROOT/animator/perl/pp_<name>.pl (fallback, Perl)
#                                $ROOT/animator/<lang>/pp_<name>.<ext> (any lang)
#                                Or absolute path.
#   order        — integer sort key; layers run in ascending order.
#                  Convention: 10=first (reorder), 100=pace, 200=highlight.
#   flag         — "always" (runs unconditionally) OR "--flag-name"
#                  (runs only when that flag is passed to the orchestrator).
#   description  — human-readable, double-quoted. Shown by --list-layers.
#
# To DISABLE a layer temporarily, comment out its line.
# To REORDER layers, change the order numbers.
# To RENAME a flag, change the flag column.
#
# ───────────────────────────────────────────────────────────────────────────
# Stage 1: Reordering (always runs first; normalizes op order + positions)
# ───────────────────────────────────────────────────────────────────────────
reorder                10   always                    "4-sweep reorder + cross-hunk position adjust"

# ───────────────────────────────────────────────────────────────────────────
# Stage 2: Optional transforms (run in declared order, only if flag is set)
# ───────────────────────────────────────────────────────────────────────────
overwrite              20   --overwrite               "Merge delete+insert pairs into overwrite_insert"
indent_last            30   --indent-last             "Move leading whitespace deletes to end of line segment"
line_delete_in_place   40   --line-delete-in-place    "Delete whole lines on their own line, not joined then deleted"

# ───────────────────────────────────────────────────────────────────────────
# Stage 3: Pacing (always runs; inserts delay ops between ops)
# ───────────────────────────────────────────────────────────────────────────
pace                   100  always                    "Insert delay ops between ops (char/word/hunk/etc.)"

# ───────────────────────────────────────────────────────────────────────────
# Stage 4: Decoration (always runs; inserts highlight/dim/fold/sign ops)
# ───────────────────────────────────────────────────────────────────────────
highlight              200  always                    "Insert highlight/dim/fold/sign ops into timed stream"
